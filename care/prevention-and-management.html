<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prevention & Management | Isha Health Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>:root{--ink:#1D4344;--ink2:#567270;--teal2:#1C4243;--sage:#D2E3DC;--sage2:#E7F0EC;--line:#D3E2DC}*{box-sizing:border-box}body{margin:0;font:400 16px/1.6 Figtree,sans-serif;color:var(--ink);background:#fff}
a{color:inherit}header{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}header img{height:34px}
.back{font-weight:600;text-decoration:none}.hero{position:relative;min-height:46vh;display:grid;align-items:end;color:#fff;background:#0c1a1a}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.hero div{position:relative;padding:clamp(24px,5vw,64px);background:linear-gradient(transparent,rgba(10,30,30,.75));width:100%}.hero small{letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-size:12px}
h1{font:400 clamp(34px,5vw,60px)/1.08 Newsreader,serif;margin:8px 0 0;max-width:900px}main{max-width:900px;margin:0 auto;padding:clamp(28px,5vw,64px) 16px;display:grid;gap:28px}
.btn{display:inline-block;border-radius:999px;padding:14px 28px;font-weight:600;text-decoration:none;background:var(--teal2);color:#fff;border:0;cursor:pointer;font-size:15px}.btn.o{background:none;color:var(--teal2);border:1.5px solid var(--teal2)}
form{background:var(--sage2);border-radius:24px;padding:clamp(20px,4vw,36px);display:grid;gap:14px}label{display:grid;gap:6px;font-weight:600;font-size:14px}input[type=text],input[type=tel]{border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;background:#fff}
.ck{display:flex;gap:10px;align-items:center;font-weight:400}.ok{color:var(--teal2);font-weight:600}.row{display:flex;gap:12px;flex-wrap:wrap}</style></head><body>
<header><a href="../index.html"><img src="../i/logo.svg" alt="Isha Health Solutions"></a><a class="back" href="../index.html">← Back to home</a></header>
<section class="hero"><img src="../i/c-prev.jpg" alt=""><div><small>Care for every health need</small><h1>Prevention & Management</h1></div></section>
<main><p style="font-size:18px">Explore consultations, therapies and programs from different systems of care, brought together around Prevention & Management.</p>
<div class="row"><a class="btn" id="mm" href="#">Book a consultation on MyMedic</a><a class="btn o" href="../index.html#needs">Explore other programs</a></div>
<form id="f"><h2 style="margin:0;font:400 28px Newsreader,serif">Register your interest</h2><label>Name<input type="text" required></label><label>Whatsapp<input type="tel" placeholder="Number with country code" required></label><label class="ck"><input type="checkbox" required> I accept the terms and conditions</label><button class="btn" type="submit">Register</button><div class="ok" id="ok" role="status"></div></form></main>
<script>var MY='';document.getElementById('mm').onclick=function(e){if(!MY){e.preventDefault();alert('The MyMedic consultation link is still to be added.')}else this.href=MY};document.getElementById('f').onsubmit=function(e){e.preventDefault();document.getElementById('ok').textContent='Thank you. Your interest has been noted (demo form, not yet connected).';this.reset()}</script></body></html>
